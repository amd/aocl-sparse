name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "amd-main" ]
  pull_request:
    branches: [ "amd-main" ]
  schedule:
    - cron: '42 19 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.compiler || matrix.language }})
    runs-on: amd_linux
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          compiler: gcc
        - language: c-cpp
          build-mode: manual
          compiler: aocc
        - language: python
          build-mode: none
          compiler: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    # Build
    - name: Build
      if: matrix['build-mode'] == 'manual'
      shell: bash
      run: |
        # Remove broken Python cmake wrapper from PATH; ensure real cmake is used
        export PATH=/usr/bin:$(echo $PATH | tr ':' '\n' | grep -v '/home/amd/.local/bin' | tr '\n' ':')
        # Allow config files to reference unbound variables
        set +u

        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          source /home/amd/AOCL_5.3/5.3.0/gcc/ST/amd-libs.cfg
        else
          source /home/amd/setenv_AOCC.sh
          source /home/amd/AOCL_5.3/5.3.0/aocc/ST/amd-libs.cfg
        fi

        cmake -S . -B out_sparse -DSUPPORT_OMP=OFF -DBUILD_ILP64=OFF -DCMAKE_INSTALL_PREFIX=$PWD/aocl-sparse
        cmake --build out_sparse --target install --config Release --parallel $(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}/compiler:${{ matrix.compiler }}"

    - name: Cleanup workspace
      if: always()
      run: rm -rf "$GITHUB_WORKSPACE"
