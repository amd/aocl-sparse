name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "amd-main" ]
  pull_request:
    branches: [ "amd-main" ]
  schedule:
    - cron: '42 19 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} - ${{ matrix.compiler }})
    runs-on: amd_linux
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          compiler: gcc
        - language: python
          build-mode: none
          compiler: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    # Build with GCC (MT)
    - name: Build with GCC (MT)
      if: matrix.build-mode == 'manual' && matrix.compiler == 'gcc'
      shell: bash
      run: |
        export PATH=/usr/local/bin:$PATH
        scp -r amd@10.86.9.164:/home/amd/aocl-daily-lib/aocl-linux-gcc-daily.tar.gz .
        tar -xf aocl-linux-gcc-daily.tar.gz
        cd aocl-linux-gcc-daily
        ./install.sh -t . -l blis libflame utils -i lp64
        cd $GITHUB_WORKSPACE
        source ./aocl-linux-gcc-daily/./daily/gcc/MT/amd-libs.cfg
        cmake -S . -B out_sparse -DBUILD_ILP64=OFF -DCMAKE_INSTALL_PREFIX=$PWD/aocl-sparse && cmake --build out_sparse --target install --config Release --parallel $(nproc)

    # Build with GCC (ST)
    - name: Build with GCC (ST)
      if: matrix.build-mode == 'manual' && matrix.compiler == 'gcc'
      shell: bash
      run: |
        export PATH=/usr/local/bin:$PATH
        cd $GITHUB_WORKSPACE
        rm -rf out_sparse/
        source ./aocl-linux-gcc-daily/daily/gcc/ST/amd-libs.cfg
        cmake -S . -B out_sparse -DSUPPORT_OMP=OFF -DBUILD_ILP64=OFF -DCMAKE_INSTALL_PREFIX=$PWD/aocl-sparse && cmake --build out_sparse --target install --config Release --parallel $(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}/compiler:${{matrix.compiler}}"
